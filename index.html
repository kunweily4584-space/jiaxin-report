<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="驗屋報告">
<meta name="application-name" content="驗屋報告">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<title>驗屋簡易報告產生器</title>
<style>
:root{--bg:#f5f2ec;--card:#fff;--ink:#1f2d3d;--mute:#6f7c88;--line:#e4dfd4;--navy:#1b3a5c;--pri:#0099c2;--pri-d:#0682ab;--pri-soft:#e5f4fa;--acc:#00a9a0;--acc-d:#00847c;--acc-soft:#ebf7f5;--acc-line:#bfe4df;--org:#f18d03;--org-soft:#fdeedd;--warn:#d0422e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:92px}
header{background:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(27,58,92,.08)}
.brand{display:flex;align-items:center;gap:12px;padding:10px 14px 8px}
.brand .logo{width:46px;height:46px;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(27,58,92,.12);display:flex;align-items:center;justify-content:center;flex:none}
.brand .logo img{width:36px;height:auto}
.brand h1{margin:0;font-size:18px;font-weight:700;color:var(--navy);letter-spacing:1px;line-height:1.25}
.brand p{margin:0;font-size:12px;color:var(--mute);letter-spacing:1px}
.stripe{height:4px;background:linear-gradient(90deg,var(--org) 0 18%,var(--acc) 18% 52%,var(--pri) 52% 100%)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;margin:0 14px 10px}
.seg button{flex:1;border:0;background:transparent;color:var(--navy);padding:7px 0;border-radius:8px;font-size:14px;font-weight:500;font-family:inherit}
.seg button.on{background:var(--pri);color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(0,153,194,.3)}
main{padding:12px 12px;max-width:720px;margin:0 auto;counter-reset:sec}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(27,58,92,.04)}
.card h2{font-size:16px;font-weight:700;margin:0 0 10px;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 .t{display:flex;align-items:center;gap:8px;flex:none}
.card:not(.hide){counter-increment:sec}
.card h2 .t::before{content:counter(sec,decimal-leading-zero);background:var(--pri);color:#fff;font-size:13px;font-weight:700;border-radius:7px;padding:2px 7px;letter-spacing:.5px}
.card h2>span:last-child{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.row label{width:64px;font-size:13px;color:var(--mute);flex:none}
input[type=text],textarea{flex:1;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;font-family:inherit;background:#fdfcfa;color:var(--ink)}
textarea{resize:vertical;min-height:40px}
input:focus,textarea:focus{outline:3px solid var(--acc-soft);border-color:var(--acc);background:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font-size:13px;color:var(--navy);flex:none;font-family:inherit;font-weight:500}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.btn.sm{padding:5px 9px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--acc-line);background:var(--acc-soft);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--acc-d);font-family:inherit;font-weight:500}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip.add{border:1px dashed var(--line);background:#fff;color:var(--mute)}
[data-el].chip{background:#fff;border-color:#9fd3e6;color:var(--pri-d)}
#paySeg .chip.on,[data-rg].chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.sub{font-size:12px;color:var(--mute);margin:8px 0 2px}
.list .li{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.list .li .n{width:22px;text-align:right;color:var(--mute);font-size:13px;flex:none}
.x{border:0;background:transparent;color:var(--warn);font-size:18px;padding:0 4px;flex:none}
.chk{width:22px;height:22px;flex:none;accent-color:var(--acc)}
.space{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;background:#fff}
.space .hd{display:flex;align-items:center;gap:8px;padding:10px 11px;background:#fbfaf7}
.space .hd .num{font-weight:700;color:#fff;background:var(--acc);border-radius:6px;padding:1px 6px;font-size:13px;min-width:24px;text-align:center}
.space .hd .num:empty{display:none}
.space .hd .nm{flex:1;font-weight:700;color:var(--navy)}
.space .hd .sm-txt{font-size:12px;color:var(--mute);display:block;font-weight:400;margin-top:2px}
.space.open{border-color:var(--org);box-shadow:0 0 0 3px var(--org-soft)}
.space.open .hd{background:var(--org-soft)}
.space.open .hd .num{background:var(--org)}
.space .bd{padding:11px;display:none}
.space.open .bd{display:block}
.items{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.item{display:flex;align-items:center;border:1px solid #c3e3ef;background:var(--pri-soft);color:var(--pri-d);border-radius:8px;font-size:13px;overflow:hidden}
.item span{padding:5px 8px}
.item.sel{background:#fff;border:2px solid var(--org);color:var(--navy);font-weight:700}
.item .x{color:inherit;font-size:15px}
.curEl{display:flex;gap:6px;align-items:center;margin-top:8px}
.curEl b{font-size:13px;color:var(--org);flex:none}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:5px 0;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.grp .gl{font-size:11px;color:var(--mute);width:100%;font-weight:500}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;z-index:30;padding-bottom:max(10px,env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(27,58,92,.06)}
.bar .btn{flex:1;padding:12px 0;font-size:15px;border-radius:12px}
.bar .btn.pri{flex:1.6;background:linear-gradient(110deg,var(--pri),var(--acc));border:0;box-shadow:0 4px 12px rgba(0,153,194,.3)}
pre#out{white-space:pre-wrap;word-break:break-all;font:14px/1.7 inherit;margin:0;background:#fdfcfa;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:80px;user-select:text;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:.95}
.modal{position:fixed;inset:0;background:rgba(27,58,92,.45);display:none;align-items:flex-end;justify-content:center;z-index:60}
.modal.show{display:flex}
.modal .box{background:#fff;width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:16px;max-height:80vh;overflow:auto;border-top:4px solid var(--acc)}
.modal h3{margin:0 0 10px;font-size:16px;color:var(--navy)}
.hist{padding:9px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.hist small{color:var(--mute)}
.atable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.atable td,.atable th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:right}
.atable th{color:var(--mute);font-weight:500}
.atable td:first-child,.atable th:first-child{text-align:left}
.atable tr.tot td{font-weight:700;color:var(--navy);border-bottom:2px solid var(--acc)}
.atable tr.bad td{color:var(--warn)}
.big{font-size:24px;font-weight:700;color:var(--org)}
.card,.space{scroll-margin-top:150px}
.card h2{flex-wrap:wrap}
.card h2>span:last-child .btn{white-space:nowrap}
.sheet{position:fixed;inset:0;background:rgba(27,58,92,.45);display:none;align-items:flex-end;justify-content:center;z-index:55}
.sheet.show{display:flex}
.sheet .box{background:#fff;width:100%;max-width:720px;border-radius:18px 18px 0 0;max-height:82vh;display:flex;flex-direction:column;border-top:4px solid var(--org)}
.sheet .top{padding:14px 14px 8px;border-bottom:1px solid var(--line)}
.sheet .mid{padding:8px 14px;overflow:auto;flex:1}
.sheet .foot{padding:10px 14px;display:flex;gap:8px;border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom))}
.sheet .foot .btn{flex:1;padding:11px 0;font-size:15px;border-radius:12px}
.sheet .prev{font-size:15px;font-weight:700;color:var(--navy);margin-top:6px;min-height:22px}
.sheet .chip{padding:8px 14px;font-size:15px}
.sheet .elin{font-size:17px;font-weight:700;color:var(--org)}
.toc a{display:flex;justify-content:space-between;align-items:center;padding:11px 6px;border-bottom:1px solid var(--line);color:var(--navy);text-decoration:none;font-weight:500}
.toc a small{color:var(--mute);font-weight:400;margin-left:8px}
.toc a .nb{background:var(--pri);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;margin-right:8px}
.toc a.spc .nb{background:var(--acc)}
.toc .cnt{background:var(--org-soft);color:var(--org);border-radius:10px;padding:1px 8px;font-size:12px;flex:none}
.hide{display:none!important}
.pay{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>

function regionOf(addr){if(/(台南|臺南|嘉義|雲林)/.test(addr))return 'N';if(/(高雄|屏東|台東|臺東)/.test(addr))return 'K';return ''}
function parseCompany(txt){
  const r={};const t=(txt||'').replace(/\r/g,'');
  const m=t.match(/(\d{4})\s*([A-Za-z0-9]+)\s*[-－]\s*(\d{1,2})\s*[:：]\s*(\d{2})\s*[-－]\s*([^\n]+)/);
  if(m){r.mmdd=m[1];r.code=m[2].toUpperCase();r.start=m[3].padStart(2,'0')+m[4];r.caseName=m[5].trim()}
  const a=t.match(/驗屋地點\s*[:：]\s*([^\n]+)/);if(a){r.addr=a[1].trim();r.region=regionOf(r.addr)}
  const c=t.match(/客戶\s*[:：]\s*([^\s\d\n]+)/);if(c)r.client=c[1].trim();
  return r;
}
function yy(mmdd){const d=new Date();let y=d.getFullYear();const mo=+mmdd.slice(0,2);if(mo-(d.getMonth()+1)>6)y--;else if((d.getMonth()+1)-mo>6)y++;return String(y).slice(2)}
function setRegion(rg){if(!rg)return;S.region=rg;store.set('insp_region',rg);if(/^[NK]/.test(S.caseNo))S.caseNo=rg+S.caseNo.slice(1);else if(S.caseNo)S.caseNo=rg+S.caseNo}

/* ---------- area ---------- */
const PING=3.305785;
const f2=n=>(Math.round(n*100)/100).toFixed(2);
function parseArea(txt){
  const groups=[[]];
  (txt||'').split('\n').forEach(raw=>{
    const line=raw.trim();if(!line)return;
    if(/^[-－—_=]{3,}$/.test(line)){if(groups[groups.length-1].length)groups.push([]);return}
    let name='',expr=line;const m=line.match(/^(.*?)[:：](.*)$/);if(m){name=m[1].trim();expr=m[2]}
    expr=expr.replace(/[×xX＊✕]/g,'*').replace(/[＆+＋、,，]/g,'&').replace(/[＊]/g,'*').replace(/\s/g,'').replace(/[．。]/g,'.');
    const terms=expr.split('&').filter(Boolean);let m2=0,ok=terms.length>0,warn=false;const parts=[];
    terms.forEach(t=>{const ns=t.split('*').map(Number);if(ns.length<2||ns.some(n=>!isFinite(n)||n<=0)){ok=false;return}if(ns.some(n=>n>20))warn=true;const a=ns.reduce((x,y)=>x*y,1);parts.push(a);m2+=a});
    groups[groups.length-1].push({name,ok,warn,m2,parts});
  });
  return groups.filter(g=>g.length);
}
function areaText(){
  const gs=parseArea(S.area);if(!gs.length)return '';
  const L=[];
  gs.forEach((g,gi)=>{
    if(gi)L.push('');
    let tot=0;
    g.forEach(r=>{if(!r.ok){L.push(r.name+'：格式有誤');return}tot+=r.m2;L.push(r.name+'：'+f2(r.m2)+'㎡（'+f2(r.m2/PING)+'坪）')});
    L.push('合計：'+f2(tot)+'㎡（'+f2(tot/PING)+'坪）');
  });
  return L.join('\n');
}
function renderArea(){
  const gs=parseArea(S.area);
  $('areaRes').innerHTML=gs.map((g,gi)=>{
    let tot=0;
    const rows=g.map(r=>{if(r.ok)tot+=r.m2;return `<tr class="${!r.ok||r.warn?'bad':''}"><td>${esc(r.name||'（未命名）')}${r.warn?' ⚠ 數值偏大':''}</td><td>${r.ok?(r.parts.length>1?r.parts.map(f2).join('+')+'=':'')+f2(r.m2):'格式有誤'}</td><td>${r.ok?f2(r.m2/PING):''}</td></tr>`}).join('');
    return `${gs.length>1?`<div class="sub">第 ${gi+1} 戶</div>`:''}<table class="atable"><tr><th>空間</th><th>㎡</th><th>坪</th></tr>${rows}<tr class="tot"><td>合計</td><td>${f2(tot)}</td><td>${f2(tot/PING)}</td></tr></table><div style="text-align:right;margin-top:4px">總計 <span class="big">${f2(tot/PING)}</span> 坪</div>`;
  }).join('');
  $('area').value!==S.area&&($('area').value=S.area||'');
  $('areaInc').checked=!!S.areaInc;
}

/* ---------- output ---------- */
function spaceText(sp){
  const parts=sp.items.filter(i=>i.el||i.df.length).map(i=>i.el+i.df.join('、'));
  const ex=(sp.extra||'').trim().replace(/[。，,.]+$/,'');
  if(ex)parts.push(ex);
  return parts.join('，');
}
function build(){
  const L=[];
  let h=[S.caseNo,S.caseName,S.client].filter(Boolean).join('/');
  if(S.pay)h+='（'+S.pay+'）';
  if(h)L.push(h);
  if(S.start||S.end)L.push((S.start?S.start+'開始':'')+(S.start&&S.end?'/':'')+(S.end?S.end+'結束':''));
  if(S.mode==='re'){
    if(S.reNote.trim()){L.push('');L.push('註：'+S.reNote.trim())}
    S.spaces.forEach(sp=>{const t=spaceText(sp);if(!sp.name&&!t)return;L.push('');L.push(sp.name+'：'+t)});
  }else{
    const notes=S.notes.filter(n=>n.trim());
    if(notes.length){L.push('');L.push('備註：');notes.forEach((n,i)=>L.push((i+1)+'.'+n.trim()))}
    const com=S.common.filter(c=>c.on&&c.t.trim());
    if(com.length){if(!notes.length)L.push('');L.push('共同：');com.forEach((c,i)=>L.push((i+1)+'.'+c.t.trim()))}
    const sps=S.spaces.filter(sp=>sp.name||spaceText(sp));
    if(sps.length){
      L.push('');L.push('各空間：');
      const pad=sps.length>=10;
      sps.forEach((sp,i)=>{const n=pad?String(i+1).padStart(2,'0'):String(i+1);const t=spaceText(sp);L.push(n+'.'+sp.name+'：'+t+(t?'。':''));L.push('')});
      L.pop();
    }
  }
  if(S.mode!=='re'&&S.areaInc){const a=areaText();if(a){L.push('');L.push('坪數：');L.push(a)}}
  // collapse accidental double blanks
  return L.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

        <div class="items">${sp.items.map((it,j)=>`<div class="item"><span data-selitem="${j}">${esc(it.el)}${esc(it.df.join('、'))}</span><button class="x" data-delitem="${j}">×</button></div>`).join('')||'<span class="sub">點下方物件，會跳出缺失選單</span>'}</div>
        <div class="sub">物件</div>
        ${ELG.map(g=>`<div class="grp"><span class="gl">${g[0]}</span>${chipRow(g[1],'el')}</div>`).join('')}<div class="grp"><span class="gl">自訂</span>${chipRow(custom.el,'el')}<button class="chip add" data-addcustom="el">＋</button></div>
        <div class="sub">其他（直接打字，會接在最後）</div>
        <textarea data-extra="${i}" placeholder="例：浴櫃管線滲水">${esc(sp.extra||'')}</textarea>
        <div class="row" style="margin-top:8px;justify-content:space-between">
          <span><button class="btn sm" data-mv="${i}" data-d="-1">↑ 上移</button> <button class="btn sm" data-mv="${i}" data-d="1">↓ 下移</button></span>
          <span><button class="btn sm" data-delsp="${i}" style="color:var(--warn)">刪除空間</button> <button class="btn sm pri" data-next="${i}">下一個空間 →</button></span>
        </div>
      </div>`;
    }
    return `<div class="space ${open?'open':''}" id="sp${i}"><div class="hd" data-toggle="${i}"><span class="num">${n}</span><span class="nm">${esc(sp.name||'（未命名）')}<span class="sm-txt">${esc(summary)}</span></span><span>${open?'▲':'▼'}</span></div>${bd}</div>`;
  }).join('')||'<div class="sub">還沒有空間，按「＋ 新增空間」開始</div>';
}
function renderAll(){renderArea();renderMode();renderHead();renderNotes();renderCommon();renderSpaces();renderOut()}

/* ---------- actions ---------- */
function cur(){return S.spaces[openIdx]}
function addSpace(){S.spaces.push({name:'',items:[],extra:''});openIdx=S.spaces.length-1;selItem=-1;save();renderSpaces();setTimeout(()=>{const e=$('sp'+openIdx);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},30)}
function nowHM(){const d=new Date();return String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')}
function todayPrefix(){const d=new Date();return (S.region||store.get('insp_region','N'))+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}

function modal(html){$('modalBox').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,[data-toggle],[data-selitem]');if(!t)return;if(t.tagName==='A')e.preventDefault();
  const d=t.dataset;
  if(d.m){if(d.m==='re'&&S.mode!=='re')S._wasHouse=(S.mode==='house');S.mode=d.m;save();renderMode();renderSpaces();return}
  if(t.id==='tocBtn'){openToc();return}
  if(t.id==='prevBtn'){openPreview();return}
  if(t.id==='prevCopy'){copy();return}
  if(d.goto){closeModal();$(d.goto).scrollIntoView({behavior:'smooth',block:'start'});return}
  if(d.gosp!==undefined){closeModal();openIdx=+d.gosp;selItem=-1;renderSpaces();setTimeout(()=>$('sp'+openIdx).scrollIntoView({behavior:'smooth',block:'start'}),30);return}
  if(t.id==='sheetMore'){sheetMore=true;renderSheet();return}
  if(t.id==='sheetDone'){closeSheet();return}
  if(t.id==='sheetDel'){const sp0=cur();if(sp0&&sheetJ>=0)sp0.items.splice(sheetJ,1);sheetJ=-1;$('sheet').classList.remove('show');save();renderSpaces();return}
  if(d.sdf){const it=cur()&&cur().items[sheetJ];if(it){const k=it.df.indexOf(d.sdf);if(k>=0)it.df.splice(k,1);else it.df.push(d.sdf);save();renderSheet()}return}
  if(d.p!==undefined&&t.closest('#paySeg')){S.pay=d.p;save();renderHead();return}
  if(d.rg){setRegion(d.rg);save();renderHead();return}
  if(t.id==='pasteBtn'){modal(`<h3>貼上公司案場資料</h3><textarea id="pasteIn" rows="5" placeholder="1118C1A-14：00-尊丞馥寓&#10;驗屋地點：嘉義市…&#10;客戶：鐘健臺 09xxxxxxxx"></textarea><div class="sub">貼上後按「帶入」，會覆蓋案場編號、名稱、客戶與開始時間</div><div class="row" style="margin-top:10px"><button class="btn" data-close>取消</button><button class="btn pri" id="pasteGo">帶入</button></div>`);setTimeout(()=>$('pasteIn').focus(),50);return}
  if(t.id==='pasteGo'){const r=parseCompany($('pasteIn').value);if(!r.mmdd&&!r.client){toast('看不懂格式，請確認');return}
    const rg=r.region||S.region||store.get('insp_region','N');
    if(r.mmdd){S.caseNo=rg+yy(r.mmdd)+r.mmdd+r.code}
    if(r.caseName)S.caseName=r.caseName;if(r.client)S.client=r.client;if(r.start)S.start=r.start;
    if(r.region){S.region=r.region;store.set('insp_region',r.region)}
    save();closeModal();renderHead();toast(r.region?'已帶入':'已帶入（地址判斷不出區域，請確認N/K）');return}
  if(d.now){S[d.now]=nowHM();save();renderHead();return}
  if(t.id==='todayBtn'){if(!S.caseNo.startsWith(todayPrefix()))S.caseNo=todayPrefix();save();renderHead();$('caseNo').focus();return}
  if(d.addnote!==undefined){S.notes.push(d.addnote);save();renderNotes();return}
  if(d.delnote){S.notes.splice(+d.delnote,1);save();renderNotes();return}
  if(d.delcom){S.common.splice(+d.delcom,1);save();renderCommon();return}
  if(t.id==='commonAdd'){const v=$('commonNew').value.trim();if(v){S.common.push({t:v,on:true});$('commonNew').value='';save();renderCommon()}return}
  if(t.id==='addSpace'){addSpace();return}
  if(d.toggle!==undefined){const i=+d.toggle;openIdx=openIdx===i?-1:i;selItem=-1;renderSpaces();if(openIdx>=0)setTimeout(()=>$('sp'+i).scrollIntoView({behavior:'smooth',block:'start'}),30);return}
  const sp=cur();
  if(sp){
    if(d.spset){sp.name=d.spset;save();renderSpaces();return}
    if(d.floor){const m=sp.name.match(/^(一|二|三|四|五|六|頂)樓/);sp.name=m?d.floor+sp.name.slice(m[0].length):d.floor+sp.name;save();renderSpaces();return}
    if(d.room){const m=sp.name.match(/^(一|二|三|四|五|六|頂)樓/);const fl=m?m[0]:'';sp.name=fl+d.room;save();renderSpaces();return}
    if(d.stair){sp.name=d.stair;save();renderSpaces();return}
    if(d.el){let j=sp.items.findIndex(x=>x.el===d.el);if(j<0){sp.items.push({el:d.el,df:[]});j=sp.items.length-1}openSheet(j);return}
    if(d.df){if(selItem<0||!sp.items[selItem]){sp.items.push({el:'',df:[]});selItem=sp.items.length-1}const it=sp.items[selItem];const k=it.df.indexOf(d.df);if(k>=0)it.df.splice(k,1);else it.df.push(d.df);save();renderSpaces();return}
    if(d.selitem!==undefined){openSheet(+d.selitem);return}
    if(d.delitem!==undefined){sp.items.splice(+d.delitem,1);selItem=-1;save();renderSpaces();return}
    if(d.mv!==undefined){const i=+d.mv,j=i+(+d.d);if(j<0||j>=S.spaces.length)return;[S.spaces[i],S.spaces[j]]=[S.spaces[j],S.spaces[i]];openIdx=j;save();renderSpaces();return}
    if(d.delsp!==undefined){modal(`<h3>刪除「${esc(sp.name||'未命名')}」？</h3><div class="row"><button class="btn" data-close>取消</button><button class="btn pri" data-confirmdelsp="${d.delsp}" style="background:var(--warn);border-color:var(--warn)">刪除</button></div>`);return}
    if(d.next!==undefined){if(+d.next===S.spaces.length-1)addSpace();else{openIdx=+d.next+1;selItem=-1;renderSpaces();setTimeout(()=>$('sp'+openIdx).scrollIntoView({behavior:'smooth',block:'start'}),30)}return}
  }
  if(d.addcustom){const kind=d.addcustom;const lab={el:'物件',df:'缺失',sp:'空間'}[kind];modal(`<h3>新增自訂${lab}</h3><div class="row"><input type="text" id="cusIn" placeholder="輸入${lab}"></div><div class="sub">已存自訂（點×刪除）</div><div class="chips">${custom[kind].map((x,i)=>`<button class="chip" data-delcus="${kind}|${i}">${esc(x)} ×</button>`).join('')||'無'}</div><div class="row" style="margin-top:10px"><button class="btn" data-close>取消</button><button class="btn pri" data-savecus="${kind}">加入</button></div>`);setTimeout(()=>$('cusIn').focus(),50);return}
  if(d.savecus){const v=$('cusIn').value.trim();if(v&&!custom[d.savecus].includes(v)){custom[d.savecus].push(v);store.set(LS_CUSTOM,custom)}closeModal();if(sheetJ>=0){const it=cur()&&cur().items[sheetJ];if(it&&d.savecus==='df'&&v&&!it.df.includes(v))it.df.push(v);save();renderSheet()}else renderSpaces();return}
  if(d.delcus){const [k,i]=d.delcus.split('|');custom[k].splice(+i,1);store.set(LS_CUSTOM,custom);closeModal();renderSpaces();return}
  if(d.confirmdelsp!==undefined){S.spaces.splice(+d.confirmdelsp,1);openIdx=-1;selItem=-1;save();closeModal();renderSpaces();return}
  if(d.close!==undefined){closeModal();return}
  if(t.id==='newBtn'){modal(`<h3>開新案場？</h3><p class="sub">目前內容會留在「紀錄」裡，可再叫回來。</p><div class="row"><button class="btn" data-close>取消</button><button class="btn pri" data-confirmnew>開新案場</button></div>`);return}
  if(d.confirmnew!==undefined){saveHist();S=blank(S.mode==='re'?'building':S.mode);S.caseNo=todayPrefix();openIdx=-1;selItem=-1;save();closeModal();renderAll();window.scrollTo(0,0);return}
  if(t.id==='histBtn'){const h=store.get(LS_HIST,[]);modal(`<h3>案場紀錄</h3>${h.map((x,i)=>`<div class="hist"><div>${esc(x.caseNo||'')} ${esc(x.caseName||'')} ${esc(x.client||'')}<br><small>${{building:'初驗大樓',house:'初驗透天',re:'複驗'}[x.mode]}・${new Date(x.ts).toLocaleString('zh-TW',{hour12:false})}</small></div><span><button class="btn sm" data-load="${i}">開啟</button> <button class="btn sm" data-tore="${i}">轉複驗</button></span></div>`).join('')||'<p class="sub">尚無紀錄</p>'}<div class="row" style="margin-top:10px"><button class="btn" data-close>關閉</button></div>`);return}
  if(d.load!==undefined){const h=store.get(LS_HIST,[]);S=JSON.parse(JSON.stringify(h[+d.load]));openIdx=-1;selItem=-1;store.set(LS_CUR,S);closeModal();renderAll();toast('已開啟');return}
  if(d.tore!==undefined){const h=store.get(LS_HIST,[]);const src=h[+d.tore];const x=JSON.parse(JSON.stringify(src));S=Object.assign(blank('re'),{caseNo:x.caseNo,caseName:x.caseName,client:x.client,pay:x.pay,_wasHouse:x.mode==='house',spaces:x.spaces.map(sp=>({name:sp.name,items:[],extra:''}))});openIdx=-1;selItem=-1;save();closeModal();renderAll();toast('已帶入空間清單，缺失清空');return}
  if(t.id==='copyBtn'||t.id==='copy2'){copy();return}
  if(t.id==='areaCopy'){copy(areaText());return}
  if(t.id==='areaFill'){const have=new Set(parseArea(S.area).flat().map(r=>r.name));const add=S.spaces.map(x=>x.name).filter(n=>n&&!have.has(n));if(!add.length){toast('沒有新的空間名');return}S.area=((S.area||'').replace(/\s+$/,'')+(S.area&&S.area.trim()?'\n':'')+add.map(n=>n+'：').join('\n'));save();renderArea();$('area').focus();return}
  if(t.id==='toTop'){window.scrollTo({top:0,behavior:'smooth'});return}
  if(t.id==='toOut'){$('out').scrollIntoView({behavior:'smooth',block:'center'});return}
});

document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(['caseNo','caseName','client','start','end','reNote'].includes(t.id)){S[t.id]=t.id==='caseNo'?t.value.toUpperCase():t.value;if(t.id==='caseNo'&&t.value!==S.caseNo){const p=t.selectionStart;t.value=S.caseNo;t.setSelectionRange(p,p)}save();return}
  if(t.id==='area'){S.area=t.value;save();renderArea();return}
  if(t.id==='areaInc'){S.areaInc=t.checked;save();return}
  if(t.id==='sheetEl'){const it=cur()&&cur().items[sheetJ];if(it){it.el=t.value;$('sheetPrev').textContent=it.el+it.df.join('、');save()}return}
  if(d.note!==undefined){S.notes[+d.note]=t.value;save();return}
  if(d.com!==undefined){S.common[+d.com].t=t.value;save();return}
  if(d.comon!==undefined){S.common[+d.comon].on=t.checked;save();return}
  const sp=cur();if(!sp)return;
  if(d.spname!==undefined){sp.name=t.value;save();updateHd();return}
  if(d.extra!==undefined){sp.extra=t.value;save();updateHd();return}
  if(d.curel!==undefined){if(selItem<0||!sp.items[selItem]){sp.items.push({el:'',df:[]});selItem=sp.items.length-1}sp.items[selItem].el=t.value;save();updateHd();
    const items=document.querySelectorAll('#sp'+openIdx+' .item span');const it=sp.items[selItem];if(items[selItem])items[selItem].textContent=it.el+(it.df.length?it.df.join('、'):'…');else renderSpaces();return}
});
document.addEventListener('change',e=>{if(e.target.id==='areaInc'){S.areaInc=e.target.checked;save();return}if(e.target.dataset.comon!==undefined){S.common[+e.target.dataset.comon].on=e.target.checked;save()}});
function updateHd(){const sp=cur();const el=$('sp'+openIdx);if(!el)return;const nm=el.querySelector('.hd .nm');nm.innerHTML=esc(sp.name||'（未命名）')+`<span class="sm-txt">${esc(spaceText(sp)||'（尚無缺失）')}</span>`}

async function copy(given){
  const txt=typeof given==='string'?given:build();if(!txt){toast('沒有內容');return}
  try{await navigator.clipboard.writeText(txt);toast('已複製')}
  catch(err){
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(e2){}
    document.body.removeChild(ta);
    if(ok)toast('已複製');else if(typeof given==='string'){toast('複製失敗，請手動選取')}else{const r=document.createRange();r.selectNodeContents($('out'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('out').scrollIntoView({block:'center'});toast('已全選，請長按複製')}
  }
}

if(!S.caseNo)S.caseNo='';
renderAll();
})();
</script>
